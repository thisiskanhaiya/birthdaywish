<body>
  <main class="shell">
    <nav class="topbar" aria-label="Page navigation"><a class="back" href="/">← Back to birthday page</a></nav>

    <h1>Quality Engineering Studio</h1>
    <p class="intro">Copy this complete prompt and paste it into your AI app builder. Use the button below to copy the prompt, or select the text to copy a section.</p>
    <section class="prompt-card" aria-label="Application prompt">
      <div class="card-head"><span>Complete application prompt</span><button class="copy" id="copyPrompt" type="button">Copy prompt</button></div>
      <textarea id="prompt" aria-label="Quality Engineering Studio prompt" readonly spellcheck="false">Create a runnable interactive application called:

QUALITY ENGINEERING STUDIO
AI-Powered Test Design for Better Quality, Faster Delivery

IMPORTANT:
Create the actual interactive UI in Preview mode, not a text explanation, document, source-code-only response, or static mock-up.

The application should be a Quality Engineering Test Design Agent that converts business requirements into structured, risk-based test cases.

The agent must use Microsoft Copilot reasoning to understand the supplied business context and generate test cases dynamically.

Do not hardcode sample test cases.
Do not use a fixed formula such as one acceptance criterion equals one test case.
The number of test cases must depend on business complexity, dependencies, rules, workflow states, risks, roles and boundaries.

==================================================
1. UI DESIGN
==================================================

Create a premium enterprise-style interface.

Visual theme:

- Warm white and light cream background
- Deep forest green as the primary color
- Soft bronze/gold as the secondary accent
- Dark grey text with strong readability
- Soft borders and subtle shadows
- Spacious but compact layout
- Clean corporate typography
- Avoid dark backgrounds
- Avoid excessive gradients or decorative elements
- Make the interface suitable for a professional Quality Engineering platform

Application header:

Quality Engineering Studio

Subtitle:

AI-Powered Test Design for Better Quality, Faster Delivery

Add a left navigation menu containing:

1. Test Design Agent
2. My Test Assets
3. Project Context
4. Integrations
5. Templates
6. Settings

Add the following main navigation tabs:

1. Agent Input
2. Test Cases
3. Test Matrix
4. Quality Summary

==================================================
2. AGENT INPUT
==================================================

Create an Agent Input screen with these fields:

A. Application / Business Background

Provide a large text area where the tester can paste:

- Requirements
- User stories
- Acceptance criteria
- Business rules
- Workflow details
- Functional specifications
- API information
- User roles
- Limits
- Status transitions
- Existing test scenarios
- Dependencies
- Any other application context

B. Scenario / Feature to Test

Provide a separate text area where the tester can specify the exact feature or functionality requiring test design.

C. Special Instructions

Provide a separate text area for instructions such as:

- Focus on negative scenarios
- Check business-rule failures
- Try unusual data combinations
- Check boundary conditions
- Check duplicate processing
- Check maker-checker rules
- Check roles and permissions
- Check state transitions
- Check EOD or batch processing
- Check date and cutoff behavior
- Check data consistency
- Focus on critical scenarios

D. Domain Selector

Provide a visible domain dropdown containing:

- Banking / BFSI
- Insurance
- E-commerce
- Healthcare
- Generic Web Application
- API Platform
- Other

Default the domain to Banking / BFSI.

E. Project Selector

Provide an optional project dropdown or text field.

F. Action Buttons

Provide:

- Generate Test Cases
- Clear
- Save Draft

==================================================
3. COPILOT AGENT BEHAVIOR
==================================================

When Generate Test Cases is selected, use Microsoft Copilot to understand the complete business context.

Do not simply rewrite acceptance criteria as test cases.

Reason like an experienced Senior Quality Engineer.

The agent should internally assess:

- What is the intended business outcome?
- How can the intended behavior fail?
- Which developer assumptions may be incorrect?
- Which fields or rules depend on one another?
- Can individually valid values become invalid when combined?
- What happens just below, at and above configured limits?
- Can duplicate processing occur?
- Can repeated submission create duplicate business effects?
- Can a restricted role perform a privileged operation?
- Can UI validation be bypassed through an API or backend request?
- Can a technically successful transaction violate the intended business rule?
- Can the transaction fail halfway?
- Can retry or recovery create duplicate processing?
- Can an invalid state transition occur?
- Can UI, API, database, audit or downstream values become inconsistent?
- Are there calculation, date, rounding, status, balance or cutoff risks?
- Which scenarios are most likely to discover genuine defects?

Generate only meaningful test cases.

Do not increase the count unnecessarily.

Create the number of test cases required by business complexity and risk.

For example, five acceptance criteria may produce 12, 20, 29 or another appropriate number of test cases.

==================================================
4. TEST COVERAGE
==================================================

Generate relevant combinations of:

- Positive scenarios
- Negative scenarios
- Boundary testing
- Equivalence partitioning
- Business-rule testing
- Critical scenarios
- Cross-field validation
- Invalid data combinations
- Role and authorization scenarios
- State-transition scenarios
- Duplicate and idempotency scenarios
- Data-consistency scenarios
- Retry and recovery scenarios
- Error-handling scenarios
- Date, time and cutoff scenarios
- Maker-checker scenarios
- EOD and batch scenarios
- Concurrency scenarios
- Integration scenarios
- Financial reconciliation scenarios
- UI and API validation differences

Only include a coverage type when it is relevant to the supplied business context.

==================================================
5. TEST CASE STRUCTURE
==================================================

Every generated test case must contain:

1. Unique Test Case ID
2. Unique Test Case Name
3. Category
4. Priority
5. Prerequisites
6. Short Scenario Description
7. Multiple understandable Test Steps when required
8. Expected Result for every individual Test Step
9. Source acceptance criterion or business rule, when available
10. Risk covered

Keep test cases atomic and focused.

Do not create very large scenario descriptions.

The Scenario Description should normally be one or two short sentences.

Test steps should describe what the tester performs.

Expected results should clearly describe the observable result.

Use “Verify” or “Validate” in expected results where appropriate.

Example:

Test Case ID:
QE-RB-005

Test Case Name:
Validate duplicate transaction prevention on repeated submission

Category:
Idempotency / Critical

Priority:
Critical

Prerequisites:
A valid beneficiary is available and the source account has sufficient balance.

Scenario Description:
Validate that repeated submission of the same valid fund-transfer request creates only one transaction.

Step 1:
Log in with an authorized customer account.

Expected Result:
Verify that authentication is successful and the customer dashboard is displayed.

Step 2:
Open the Fund Transfer function.

Expected Result:
Verify that the Fund Transfer page is displayed with the permitted transaction options.

Step 3:
Enter valid beneficiary and transfer details.

Expected Result:
Validate that the entered data is accepted without an incorrect validation error.

Step 4:
Submit the same request twice in rapid succession.

Expected Result:
Validate that only one request is processed and the duplicate request is safely rejected or identified.

Step 5:
Review transaction history and account balance.

Expected Result:
Verify that exactly one transaction and one debit are recorded.

==================================================
6. GENERATED TEST CASES DASHBOARD
==================================================

After generation, open the Test Cases tab.

At the top, prominently display:

“29 Test Cases Generated”

The displayed number must be dynamic and must show the actual generated test-case count.

Display summary cards for:

- Positive
- Negative
- Boundary
- Critical
- Business Rule
- Authorization
- Idempotency
- Other relevant categories

Use different soft colors for the categories while maintaining the cream, green and bronze visual theme.

Add:

- Generated time
- Selected domain
- Selected project
- Regenerate button
- Export Excel button
- Search box
- Category filter
- Priority filter

Create a test-case table with these columns:

- Test Case ID
- Test Case Name
- Category
- Priority
- Number of Steps
- Expected Result Summary
- Status
- Actions

The Actions column should contain:

- View
- Edit
- Copy
- Delete

When View is selected, expand the complete test case and show:

- Prerequisites
- Scenario Description
- Business Rule / AC Reference
- Risk Covered
- All Test Steps
- Expected Result for each step

Add pagination and rows-per-page selection.

==================================================
7. TEST MATRIX
==================================================

Create a Test Matrix automatically when it adds value.

The matrix can include:

- Business condition
- Input or data condition
- User role
- Account or object status
- Boundary
- Transaction state
- Execution variation
- Expected behavior
- Covered Test Case ID

Do not create an unnecessary matrix when the supplied feature does not require one.

==================================================
8. QUALITY SUMMARY
==================================================

Create a Quality Summary dashboard containing:

- Total Test Cases
- Positive Cases
- Negative Cases
- Boundary Cases
- Critical Cases
- Business-Rule Cases
- Authorization Cases
- Duplicate / Idempotency Cases
- State-Transition Cases
- Data-Consistency Cases

Create a separate section called:

Critical Quality Scenarios

Only include the highest-value defect-finding scenarios in this section.

Also show:

- Business rules identified
- Risks identified
- Acceptance criteria covered
- Acceptance criteria requiring clarification
- Coverage gaps
- Assumptions made by the agent

==================================================
9. EXCEL EXPORT
==================================================

The Export Excel button must work.

Export the generated test cases using these columns:

- Test Case ID
- Test Case Name
- Category
- Priority
- Prerequisite
- Scenario Description
- Source AC / Business Rule
- Risk Covered
- Step Number
- Test Step
- Expected Result

For a test case with multiple steps:

- The first Excel row should contain all test-case-level information.
- The following rows should leave Test Case ID, Name, Category, Priority, Prerequisite and Scenario Description blank.
- The following rows should continue only with Step Number, Test Step and Expected Result.
- Every step must remain paired with its corresponding expected result.

If direct XLSX creation is unavailable, create a UTF-8 CSV file that opens correctly in Microsoft Excel.

==================================================
10. DATA AND AI IMPLEMENTATION
==================================================

The AI should return concise structured content, preferably JSON.

Use an output structure similar to:

{
  "summary": {
    "total": 29,
    "positive": 6,
    "negative": 7,
    "boundary": 4,
    "critical": 5,
    "businessRule": 3,
    "authorization": 2,
    "idempotency": 2
  },
  "testCases": [
    {
      "testCaseId": "QE-RB-001",
      "testCaseName": "Verify successful fund transfer with valid details",
      "category": "Positive",
      "priority": "High",
      "prerequisite": "Valid customer, beneficiary and sufficient balance are available.",
      "scenarioDescription": "Validate successful fund transfer using valid business data.",
      "sourceRule": "AC-01",
      "riskCovered": "Incorrect balance or incomplete transfer processing",
      "steps": [
        {
          "stepNumber": 1,
          "testStep": "Log in with valid customer credentials.",
          "expectedResult": "Verify that authentication is successful and the dashboard is displayed."
        }
      ]
    }
  ]
}

Use deterministic application code for:

- UI rendering
- Test Case ID formatting
- Filtering
- Searching
- Pagination
- Category counts
- Excel or CSV export
- Validation of missing fields

Do not ask the AI to repeatedly generate visual tables or styling.

The AI should generate the test content.
The application code should control the dashboard presentation.

==================================================
11. IMPORTANT LIMITATIONS AND SAFETY
==================================================

This is a Quality Engineering Test Design Agent.

It must not perform destructive testing or attack systems.

It should generate test scenarios only for authorized QA, test or UAT environments.

The generated test cases are recommendations and require Quality Engineer review.

Display this message in the application:

“AI-generated test cases must be reviewed and approved by a Quality Engineer before execution or publication.”

==================================================
12. FINAL DELIVERY
==================================================

Create the complete runnable interactive UI now.

Do not return only React source code.
Do not return only an explanation.
Do not create a document instead of the application.

Open the application in Preview mode so that I can:

- Enter business context
- Select a domain
- Generate test cases
- Review test steps and expected results
- View the test matrix
- View the quality summary
- Export the results to Excel or CSV

If the current Microsoft Copilot environment cannot dynamically call an AI model from inside the generated application, still create the complete runnable dashboard and clearly label it:

“Interactive MVP Prototype”

Do not silently replace dynamic AI generation with hardcoded test cases.

If dynamic AI invocation is unavailable, keep the test-generation interface ready for a future approved Copilot Studio agent or API integration.</textarea>
      <p class="notice" id="copyStatus" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script>
    const prompt = document.getElementById('prompt')
    const copyButton = document.getElementById('copyPrompt')
    const copyStatus = document.getElementById('copyStatus')
    copyButton.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(prompt.value)
      } catch {
        prompt.focus()
        prompt.select()
        document.execCommand('copy')
        prompt.setSelectionRange(0, 0)
      }
      copyStatus.textContent = 'Prompt copied. Paste it wherever you need it.'
      copyButton.textContent = 'Copied!'
      window.setTimeout(() => { copyButton.textContent = 'Copy prompt' }, 2200)
    })
  </script>
</body>
</html>
